<title id="t">Website rebuild pipeline</title>
<desc id="d">A customer's existing site is scraped for pages, content and assets, audited for SEO, security and UX gaps, regenerated with the Gemini API, and deployed to dedicated infrastructure. The new site is wired into the RadioFX API suite of chat, polls, streaming and contests.</desc>
