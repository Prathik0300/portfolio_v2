<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 950" width="1120" height="950" role="img" aria-labelledby="t d" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
<title id="t">CRLite+ data flow</title>
<desc id="d">Offline, a Python script builds a blacklist and a whitelist Bloom filter from simulated revoked and valid serial datasets and writes cascadeFilters.json. The file is packaged with the extension build, compressed and versioned. At runtime the extension loads it, asks the Node.js backend for a certificate's serial on each tab load, hashes it, and checks the blacklist: not in it means allow. If it is, a whitelist check decides between allow as a false positive and block, which redirects to blocked.html. Errors loading the filters or reaching the backend also end in a block.</desc>
