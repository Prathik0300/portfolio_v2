<text x="410" y="162.5" font-size="13" fill="#ebdbb2" font-weight="400" text-anchor="middle">MurmurHash3,</text>
<text x="410" y="178.5" font-size="13" fill="#ebdbb2" font-weight="400" text-anchor="middle">k hash seeds</text>
