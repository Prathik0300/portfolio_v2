<text x="680" y="96.5" font-size="13" fill="#ebdbb2" font-weight="400" text-anchor="middle">Blacklist Bloom</text>
<text x="680" y="112.5" font-size="13" fill="#ebdbb2" font-weight="400" text-anchor="middle">filter (level 1)</text>
