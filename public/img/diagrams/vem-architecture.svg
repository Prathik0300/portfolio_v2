<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="t d" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
<title id="t">Virtual Emotion Mirror system architecture</title>
<desc id="d">A webcam feeds the React app, which sends a base64 image to the NestJS API gateway. The gateway sends the image data to a Python inference service and gets an emotion result back, passes the emotion to Spotify and IMDB connectors that fetch playlists and movies, and stores predictions and recommendations in MongoDB. The emotion dashboard queries MongoDB for analytics.</desc>
