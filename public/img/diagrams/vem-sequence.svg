<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1146 1376" width="1146" height="1376" role="img" aria-labelledby="t d" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
<title id="t">Virtual Emotion Mirror: one session</title>
<desc id="d">A sequence diagram across the user, the frontend, the NestJS gateway, the emotion detection and genre mapping services, MongoDB, Spotify and IMDB. The user logs in and captures a face image, which goes to the gateway. In parallel the emotion detection service returns the emotion, which is logged and shown, and the genre mapping service maps it to music and movie genres using the user's content history. The gateway then fetches a playlist from Spotify and movies from IMDB. Negative emotions get uplifting or calming music and positive movies, positive emotions get high-energy music and feel-good movies. The frontend shows the recommendations and the user can give feedback.</desc>
