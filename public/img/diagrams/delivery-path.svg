<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-labelledby="t d" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
<title id="t">Delivery path on GKE</title>
<desc id="d">A git commit goes through CI with a Trivy scan, then ArgoCD syncs the multi-tenant GKE cluster to what is in git. Terraform provisions the GKE infrastructure. Deploys went from 40 minutes on Jenkins to 10 minutes.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#9a8c7c"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#9a8c7c"/></marker>
</defs>
<rect width="1000" height="340" fill="#1d2021"/>
<rect x="40" y="40" width="200" height="88" rx="3" fill="#282828" stroke="#9a8c7c" stroke-width="1.5"/>
<text x="54" y="68" font-size="15" fill="#fabd2f" font-weight="600" text-anchor="start">1</text>
<text x="82" y="68" font-size="15" fill="#ebdbb2" font-weight="600" text-anchor="start">Git commit</text>
<text x="54" y="92" font-size="13" fill="#bdae93" font-weight="400" text-anchor="start">the change is pushed</text>
<rect x="293" y="40" width="200" height="88" rx="3" fill="#282828" stroke="#8ec07c" stroke-width="1.5"/>
<text x="307" y="68" font-size="15" fill="#fabd2f" font-weight="600" text-anchor="start">2</text>
<text x="335" y="68" font-size="15" fill="#ebdbb2" font-weight="600" text-anchor="start">CI</text>
<text x="307" y="92" font-size="13" fill="#bdae93" font-weight="400" text-anchor="start">Trivy scans the build</text>
<text x="307" y="110" font-size="13" fill="#bdae93" font-weight="400" text-anchor="start">before it can ship</text>
<rect x="546" y="40" width="200" height="88" rx="3" fill="#282828" stroke="#8ec07c" stroke-width="1.5"/>
<text x="560" y="68" font-size="15" fill="#fabd2f" font-weight="600" text-anchor="start">3</text>
<text x="588" y="68" font-size="15" fill="#ebdbb2" font-weight="600" text-anchor="start">ArgoCD</text>
<text x="560" y="92" font-size="13" fill="#bdae93" font-weight="400" text-anchor="start">syncs the cluster to</text>
<text x="560" y="110" font-size="13" fill="#bdae93" font-weight="400" text-anchor="start">what is in git</text>
<rect x="799" y="40" width="200" height="88" rx="3" fill="#282828" stroke="#83a598" stroke-width="1.5"/>
<text x="813" y="68" font-size="15" fill="#fabd2f" font-weight="600" text-anchor="start">4</text>
<text x="841" y="68" font-size="15" fill="#ebdbb2" font-weight="600" text-anchor="start">GKE</text>
<text x="813" y="92" font-size="13" fill="#bdae93" font-weight="400" text-anchor="start">multi-tenant cluster</text>
<text x="813" y="110" font-size="13" fill="#bdae93" font-weight="400" text-anchor="start">serves the traffic</text>
<path d="M240,84 L293,84" fill="none" stroke="#9a8c7c" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M493,84 L546,84" fill="none" stroke="#9a8c7c" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M746,84 L799,84" fill="none" stroke="#9a8c7c" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="799" y="190" width="200" height="88" rx="3" fill="#282828" stroke="#fe8019" stroke-width="1.5"/>
<text x="813" y="218" font-size="15" fill="#ebdbb2" font-weight="600" text-anchor="start">Terraform</text>
<text x="813" y="242" font-size="13" fill="#bdae93" font-weight="400" text-anchor="start">provisions the GKE</text>
<text x="813" y="260" font-size="13" fill="#bdae93" font-weight="400" text-anchor="start">infrastructure</text>
<path d="M899,190 L899,128" fill="none" stroke="#fe8019" stroke-width="1.5" marker-end="url(#a)"/>
<text x="909" y="183" font-size="12" fill="#fe8019" font-weight="400" text-anchor="start">provisions</text>
<text x="40" y="202" font-size="14" fill="#fabd2f" font-weight="600" text-anchor="start">minutes to deploy</text>
<text x="40" y="216" font-size="12" fill="#bdae93" font-weight="400" text-anchor="start">Jenkins (before)</text>
<rect x="40" y="226" width="420" height="24" fill="#9a8c7c"/>
<text x="470" y="243" font-size="13" fill="#ebdbb2" font-weight="600" text-anchor="start">40 min</text>
<text x="40" y="274" font-size="12" fill="#bdae93" font-weight="400" text-anchor="start">GitOps on GKE (after)</text>
<rect x="40" y="284" width="105" height="24" fill="#8ec07c"/>
<text x="155" y="301" font-size="13" fill="#ebdbb2" font-weight="600" text-anchor="start">10 min</text>
</svg>
