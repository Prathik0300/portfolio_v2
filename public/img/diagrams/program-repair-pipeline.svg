<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
<title id="t">Program repair pipeline</title>
<desc id="d">Seven steps: strip comments from the source, have an LLM write a seed-input script, fuzz with AFL to find and shrink crashing inputs, collect GDB stack traces, ask the LLM for a patch using the code, inputs and traces, then compile, test and score the patch. If it is not fixed the loop goes back to the repair step.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#9a8c7c"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#9a8c7c"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#fe8019"/></marker>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#8ec07c"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#b8bb26"/></marker>
</defs>
<rect width="960" height="440" fill="#1d2021"/>
<rect x="50" y="30" width="270" height="92" rx="3" fill="#282828" stroke="#9a8c7c" stroke-width="1.5"/>
<text x="64" y="58" font-size="15" fill="#fabd2f" font-weight="600" text-anchor="start">1</text>
<text x="92" y="58" font-size="15" fill="#ebdbb2" font-weight="600" text-anchor="start">Source code</text>
<text x="64" y="82" font-size="13" fill="#bdae93" font-weight="400" text-anchor="start">a C or C++ program</text>
<text x="64" y="100" font-size="13" fill="#bdae93" font-weight="400" text-anchor="start">that crashes</text>
<rect x="360" y="30" width="270" height="92" rx="3" fill="#282828" stroke="#8ec07c" stroke-width="1.5"/>
<text x="374" y="58" font-size="15" fill="#fabd2f" font-weight="600" text-anchor="start">2</text>
<text x="402" y="58" font-size="15" fill="#ebdbb2" font-weight="600" text-anchor="start">Strip comments</text>
<text x="374" y="82" font-size="13" fill="#bdae93" font-weight="400" text-anchor="start">so the model gets no</text>
<text x="374" y="100" font-size="13" fill="#bdae93" font-weight="400" text-anchor="start">human hints</text>
<rect x="670" y="30" width="270" height="92" rx="3" fill="#282828" stroke="#d3869b" stroke-width="1.5"/>
<text x="684" y="58" font-size="15" fill="#fabd2f" font-weight="600" text-anchor="start">3</text>
<text x="712" y="58" font-size="15" fill="#ebdbb2" font-weight="600" text-anchor="start">Seed script</text>
<text x="684" y="82" font-size="13" fill="#bdae93" font-weight="400" text-anchor="start">LLM writes a script that</text>
<text x="684" y="100" font-size="13" fill="#bdae93" font-weight="400" text-anchor="start">makes valid starting inputs</text>
<rect x="670" y="170" width="270" height="92" rx="3" fill="#282828" stroke="#8ec07c" stroke-width="1.5"/>
<text x="684" y="198" font-size="15" fill="#fabd2f" font-weight="600" text-anchor="start">4</text>
<text x="712" y="198" font-size="15" fill="#ebdbb2" font-weight="600" text-anchor="start">Fuzz</text>
<text x="684" y="222" font-size="13" fill="#bdae93" font-weight="400" text-anchor="start">AFL or AFL++ finds crashing</text>
<text x="684" y="240" font-size="13" fill="#bdae93" font-weight="400" text-anchor="start">inputs, afl-tmin shrinks them</text>
<rect x="360" y="170" width="270" height="92" rx="3" fill="#282828" stroke="#8ec07c" stroke-width="1.5"/>
<text x="374" y="198" font-size="15" fill="#fabd2f" font-weight="600" text-anchor="start">5</text>
<text x="402" y="198" font-size="15" fill="#ebdbb2" font-weight="600" text-anchor="start">Stack traces</text>
<text x="374" y="222" font-size="13" fill="#bdae93" font-weight="400" text-anchor="start">GDB trace for each crash,</text>
<text x="374" y="240" font-size="13" fill="#bdae93" font-weight="400" text-anchor="start">FNV-1a dedupe, keep five</text>
<rect x="50" y="170" width="270" height="92" rx="3" fill="#282828" stroke="#d3869b" stroke-width="1.5"/>
<text x="64" y="198" font-size="15" fill="#fabd2f" font-weight="600" text-anchor="start">6</text>
<text x="92" y="198" font-size="15" fill="#ebdbb2" font-weight="600" text-anchor="start">Repair</text>
<text x="64" y="222" font-size="13" fill="#bdae93" font-weight="400" text-anchor="start">LLM sees code, inputs and</text>
<text x="64" y="240" font-size="13" fill="#bdae93" font-weight="400" text-anchor="start">traces, and writes a patch</text>
<rect x="50" y="310" width="270" height="92" rx="3" fill="#282828" stroke="#8ec07c" stroke-width="1.5"/>
<text x="64" y="338" font-size="15" fill="#fabd2f" font-weight="600" text-anchor="start">7</text>
<text x="92" y="338" font-size="15" fill="#ebdbb2" font-weight="600" text-anchor="start">Compile, test, score</text>
<text x="64" y="362" font-size="13" fill="#bdae93" font-weight="400" text-anchor="start">compiles? crash gone? tests</text>
<text x="64" y="380" font-size="13" fill="#bdae93" font-weight="400" text-anchor="start">pass? how big is the edit?</text>
<rect x="360" y="310" width="270" height="92" rx="3" fill="#282828" stroke="#9a8c7c" stroke-width="1.5"/>
<text x="374" y="338" font-size="15" fill="#ebdbb2" font-weight="600" text-anchor="start">Patch accepted</text>
<text x="374" y="362" font-size="13" fill="#bdae93" font-weight="400" text-anchor="start">crash fixed, tests pass</text>
<path d="M320,76 L360,76" fill="none" stroke="#9a8c7c" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M630,76 L670,76" fill="none" stroke="#9a8c7c" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M805,122 L805,170" fill="none" stroke="#9a8c7c" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M670,216 L630,216" fill="none" stroke="#9a8c7c" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M360,216 L320,216" fill="none" stroke="#9a8c7c" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M185,262 L185,310" fill="none" stroke="#9a8c7c" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M320,356 L360,356" fill="none" stroke="#b8bb26" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="332" y="348" font-size="13" fill="#b8bb26" font-weight="400" text-anchor="start">fixed</text>
<path d="M50,356 L30,356 L30,216 L50,216" fill="none" stroke="#fe8019" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ao)"/>
<text x="20" y="386" font-size="12" fill="#fe8019" font-weight="400" text-anchor="start" transform="rotate(-90 20 386)">not fixed: retry</text>
<rect x="670" y="314" width="14" height="14" rx="2" fill="none" stroke="#d3869b" stroke-width="1.5"/>
<text x="694" y="326" font-size="13" fill="#bdae93" font-weight="400" text-anchor="start">LLM step</text>
<rect x="670" y="338" width="14" height="14" rx="2" fill="none" stroke="#8ec07c" stroke-width="1.5"/>
<text x="694" y="350" font-size="13" fill="#bdae93" font-weight="400" text-anchor="start">tool or program step</text>
<rect x="670" y="362" width="14" height="14" rx="2" fill="none" stroke="#9a8c7c" stroke-width="1.5"/>
<text x="694" y="374" font-size="13" fill="#bdae93" font-weight="400" text-anchor="start">input or outcome</text>
<text x="670" y="420" font-size="12" fill="#9a8c7c" font-weight="400" text-anchor="start">On each retry the model remembers</text>
<text x="670" y="435" font-size="12" fill="#9a8c7c" font-weight="400" text-anchor="start">what it tried before.</text>
</svg>
