<rect x="190" y="36" width="130" height="60" rx="4" fill="#282828" stroke="#9a8c7c" stroke-width="1.5"/>
<text x="255" y="62.5" font-size="13" fill="#ebdbb2" font-weight="400" text-anchor="middle">Face</text>
<text x="255" y="78.5" font-size="13" fill="#ebdbb2" font-weight="400" text-anchor="middle">detection</text>
<polygon points="350,66 366,34 464,34 480,66 464,98 366,98" fill="#282828" stroke="#fabd2f" stroke-width="1.5"/>
<text x="415" y="62.5" font-size="13" fill="#ebdbb2" font-weight="400" text-anchor="middle">Face</text>
<text x="415" y="78.5" font-size="13" fill="#ebdbb2" font-weight="400" text-anchor="middle">detected?</text>
<rect x="510" y="36" width="130" height="60" rx="4" fill="#282828" stroke="#9a8c7c" stroke-width="1.5"/>
<text x="575" y="62.5" font-size="13" fill="#ebdbb2" font-weight="400" text-anchor="middle">Isolate facial</text>
<text x="575" y="78.5" font-size="13" fill="#ebdbb2" font-weight="400" text-anchor="middle">landmarks</text>
<text x="510" y="30" font-size="12" fill="#9a8c7c" text-anchor="start" stroke="#1d2021" stroke-width="5" paint-order="stroke" stroke-linejoin="round">feature extraction</text>
