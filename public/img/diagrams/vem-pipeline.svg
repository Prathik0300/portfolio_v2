<text x="95" y="265.5" font-size="13" fill="#ebdbb2" font-weight="400" text-anchor="middle">model</text>
<text x="95" y="281.5" font-size="13" fill="#ebdbb2" font-weight="400" text-anchor="middle">prediction</text>
<text x="105" y="225" font-size="12" fill="#9a8c7c" text-anchor="start" stroke="#1d2021" stroke-width="5" paint-order="stroke" stroke-linejoin="round">emotion classification</text>
<rect x="190" y="231" width="130" height="60" rx="4" fill="#282828" stroke="#9a8c7c" stroke-width="1.5"/>
<text x="255" y="249.5" font-size="13" fill="#ebdbb2" font-weight="400" text-anchor="middle">Probabilistic</text>
<text x="255" y="265.5" font-size="13" fill="#ebdbb2" font-weight="400" text-anchor="middle">output</text>
<text x="255" y="281.5" font-size="13" fill="#ebdbb2" font-weight="400" text-anchor="middle">(confidence)</text>
<rect x="350" y="231" width="130" height="60" rx="4" fill="#282828" stroke="#9a8c7c" stroke-width="1.5"/>
<text x="415" y="249.5" font-size="13" fill="#ebdbb2" font-weight="400" text-anchor="middle">Aggregate</text>
<text x="415" y="265.5" font-size="13" fill="#ebdbb2" font-weight="400" text-anchor="middle">predictions</text>
<text x="415" y="281.5" font-size="13" fill="#ebdbb2" font-weight="400" text-anchor="middle">over time</text>
<text x="350" y="225" font-size="12" fill="#9a8c7c" text-anchor="start" stroke="#1d2021" stroke-width="5" paint-order="stroke" stroke-linejoin="round">temporal smoothing</text>
<rect x="510" y="231" width="130" height="60" rx="4" fill="#282828" stroke="#9a8c7c" stroke-width="1.5"/>
<text x="575" y="249.5" font-size="13" fill="#ebdbb2" font-weight="400" text-anchor="middle">Output smoothed</text>
<text x="575" y="265.5" font-size="13" fill="#ebdbb2" font-weight="400" text-anchor="middle">emotion</text>
<text x="575" y="281.5" font-size="13" fill="#ebdbb2" font-weight="400" text-anchor="middle">prediction</text>
<rect x="670" y="231" width="130" height="60" rx="4" fill="#282828" stroke="#9a8c7c" stroke-width="1.5"/>
<text x="735" y="249.5" font-size="13" fill="#ebdbb2" font-weight="400" text-anchor="middle">Confidence-</text>
<text x="735" y="265.5" font-size="13" fill="#ebdbb2" font-weight="400" text-anchor="middle">based decision</text>
<text x="735" y="281.5" font-size="13" fill="#ebdbb2" font-weight="400" text-anchor="middle">making</text>
