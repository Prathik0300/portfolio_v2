<text x="735" y="54.5" font-size="13" fill="#ebdbb2" font-weight="400" text-anchor="middle">Extract</text>
<text x="735" y="70.5" font-size="13" fill="#ebdbb2" font-weight="400" text-anchor="middle">expression</text>
<text x="735" y="86.5" font-size="13" fill="#ebdbb2" font-weight="400" text-anchor="middle">features</text>
